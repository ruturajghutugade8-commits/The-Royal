{% extends "base.html" %}
{% block title %}Login - The Royal Cakes{% endblock %}
{% block content %}
<div class="form-box">
<h2>Login</h2>
<form method="POST">
<input type="email" name="email" placeholder="Email" required>
<input type="password" name="password" placeholder="Password" required>
<button class="btn" type="submit">Login</button>
</form>
<p>New customer? <a href="{{ url_for('register') }}">Create account</a></p>
</div>
{% endblock %}
